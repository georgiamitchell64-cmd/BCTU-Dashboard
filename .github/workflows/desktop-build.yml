# Builds the Windows desktop installer.
#
# Run this from the Actions tab (Run workflow) and download the finished
# installer from the run's Artifacts section. It exists because the installer
# needs a Windows machine plus network access to CRAN, and produces a ~600MB
# artefact that has no business in git.
#
# What goes in: R and its packages, pandoc and a headless Chrome for report
# export, the Electron launcher in electron/, and a copy of the dashboard
# staged by scripts/prepare_distribution.R — so the installer carries no
# accounts and no participant data. The last step checks that rather than
# trusting it.
#
# The result installs per-user and needs nothing else on the machine: no R, no
# RStudio, no Chrome.
#
# Roughly 30-40 minutes, most of it installing R packages.

name: Desktop build (Windows)

on:
  workflow_dispatch:
    inputs:
      r-version:
        description: "R version to bundle"
        required: false
        default: "4.4.2"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Install R via the standard action rather than fetch-r.ps1: the action
      # caches, and we copy the result into electron/runtime/R so the packaged
      # layout is identical to a local `npm run fetch-r`.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ inputs.r-version || '4.4.2' }}
          use-public-rspm: true

      - name: Install R packages
        shell: Rscript {0}
        run: |
          pkgs <- c(
            "shiny", "bslib", "shinyWidgets", "shinyjs", "reactable", "echarts4r",
            "shinycssloaders", "dplyr", "tidyr", "stringr", "lubridate", "writexl",
            "readxl", "leaflet", "tibble", "rlang", "DBI", "RSQLite", "jsonlite",
            "digest", "rmarkdown", "knitr", "purrr", "htmltools", "base64enc",
            "officer", "flextable", "scales"
          )
          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) install.packages(missing)
          still <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(still)) stop("Failed to install: ", paste(still, collapse = ", "))
          cat("All", length(pkgs), "packages present.\n")

      - name: Stage the R runtime into electron/runtime/R
        shell: pwsh
        run: |
          $rHome = & Rscript -e "cat(R.home())"
          Write-Host "R.home() = $rHome"
          $dest = "electron/runtime/R"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "$rHome\*" -Destination $dest -Recurse -Force
          # Fold the user library in, so the packaged R can see the packages.
          $libs = & Rscript -e "cat(paste(.libPaths(), collapse=';'))"
          foreach ($lib in $libs -split ';') {
            if ($lib -and (Test-Path $lib) -and ($lib -notlike "$rHome*")) {
              Copy-Item -Path "$lib\*" -Destination "$dest\library" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $n = (Get-ChildItem "$dest\library" -Directory).Count
          Write-Host "Bundled library contains $n packages"
          if (-not (Test-Path "$dest\bin\x64\Rscript.exe") -and -not (Test-Path "$dest\bin\Rscript.exe")) {
            throw "Rscript.exe missing from the staged runtime"
          }

      # pandoc is what rmarkdown shells out to for HTML/PDF report export.
      # It normally arrives with RStudio, which a packaged app does not have,
      # so bundle it explicitly or report generation fails on a clean machine.
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Bundle pandoc alongside R
        shell: pwsh
        run: |
          $pandoc = (Get-Command pandoc).Source
          $dest = "electron/runtime/pandoc"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $pandoc -Destination $dest -Force
          Write-Host "Bundled: $pandoc"

      # The other half of report export: PDF is printed by a headless Chrome
      # through chromote. An installed Chrome is likely but not guaranteed, and
      # the point of an installer is that nothing else has to be true.
      #
      # fetch_runtime.R is what does this on a user's own machine, so it is
      # what resolves the version and unpacks the layout globals/runtime.R
      # looks for. Using it here keeps those two from drifting apart. It lands
      # in the app folder, so move it over.
      - name: Bundle a headless Chrome alongside R
        shell: pwsh
        working-directory: BCTU_Clinical_Trials_Dashboard
        run: |
          Rscript scripts/fetch_runtime.R --chrome
          $src = "runtime/chrome"
          if (-not (Test-Path $src)) { throw "fetch_runtime.R did not produce $src" }
          $dest = "../electron/runtime"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Move-Item $src "$dest/chrome" -Force
          $exe = Get-ChildItem "$dest/chrome" -Recurse -Filter "chrome-headless-shell.exe"
          if (-not $exe) { throw "chrome-headless-shell.exe missing from the staged runtime" }
          Write-Host "Bundled: $($exe[0].FullName)"

      # These need neither node_modules nor Electron, and they check the
      # launcher against the R installed above — so run them before the slow
      # part, where a failure is cheap.
      - name: Test the launcher
        working-directory: electron
        run: npm test

      - name: Install Electron tooling
        working-directory: electron
        run: npm install

      # `npm run dist` stages the app first (predist -> npm run stage), which
      # is scripts/prepare_distribution.R: the packaged copy is the stripped
      # one, with no accounts, activity log or participant records in it. The
      # first person to register on the installed app becomes its admin.
      - name: Build installer
        working-directory: electron
        run: npm run dist

      - name: Check nothing personal got packaged
        shell: Rscript {0}
        run: |
          source("BCTU_Clinical_Trials_Dashboard/scripts/prepare_distribution.R")
          left <- remaining_rows("dist-staging")
          for (f in names(left)) cat(sprintf("  %-44s %s\n", f, paste(left[[f]], collapse = " ")))
          bad <- Filter(function(v) any(!grepl("^(sites|projection_settings)=", v)), left)
          if (length(bad)) stop("staged copy still holds: ",
                                paste(names(bad), collapse = ", "))
          csv <- list.files("dist-staging", pattern = "[.]csv$", recursive = TRUE)
          csv <- grep("(^|/)data/", csv, value = TRUE)
          if (length(csv)) stop("staged copy still holds data exports: ",
                                paste(csv, collapse = ", "))
          cat("Staged copy is clean.\n")

      - name: List output
        shell: pwsh
        run: Get-ChildItem electron/dist -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: BCTU-Dashboard-Windows-Installer
          path: electron/dist/*.exe
          retention-days: 14
          if-no-files-found: error
