# Syntax check for the Shiny dashboard.
#
# This replaces the stock GitHub "R package" workflow, which ran rcmdcheck on
# macos-latest. That never suited this repository: rcmdcheck and
# remotes::install_deps both expect a DESCRIPTION file, and this is a Shiny app,
# not a package. It also stopped installing R at all once macos-latest moved to
# Apple Silicon, because there is no arm64 build of R 3.6.3 to download.
#
# What runs instead: every .R and .Rmd file is parsed. That catches the failure
# that actually bites — a syntax error committed to a module, which otherwise
# only shows up when someone launches the app — and it needs nothing installed
# beyond R itself and knitr.

name: R

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  parse:
    name: Parse R sources
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install knitr
        shell: Rscript {0}
        run: install.packages("knitr")

      - name: Parse every R and Rmd file
        shell: Rscript {0}
        run: |
          skip <- "(^|/)([.]git|[.]Rproj[.]user|renv|packrat|node_modules|planner)/"

          collect <- function(pattern) {
            files <- list.files(".", pattern = pattern, recursive = TRUE, full.names = TRUE)
            sort(files[!grepl(skip, files)])
          }

          parse_r <- function(path) parse(path, keep.source = FALSE)

          parse_rmd <- function(path) {
            code <- knitr::purl(path, output = tempfile(fileext = ".R"),
                                quiet = TRUE, documentation = 0L)
            parse(code, keep.source = FALSE)
          }

          run <- function(files, fn, label) {
            cat("\n", length(files), " ", label, " files\n", sep = "")
            bad <- character()
            for (path in files) {
              message <- tryCatch({ fn(path); NA_character_ },
                                  error = function(e) conditionMessage(e))
              if (is.na(message)) {
                cat("  ok  ", path, "\n", sep = "")
              } else {
                cat("FAIL  ", path, "\n", sep = "")
                bad[path] <- message
              }
            }
            bad
          }

          failures <- c(run(collect("[.][Rr]$"), parse_r, "R"),
                        run(collect("[.][Rr]md$"), parse_rmd, "Rmd"))

          if (length(failures) > 0) {
            cat("\n", length(failures), " file(s) failed to parse:\n\n", sep = "")
            for (path in names(failures)) {
              cat(path, "\n  ", failures[[path]], "\n\n", sep = "")
            }
            quit(status = 1L)
          }

          cat("\nEverything parsed cleanly.\n")

  tests:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The tests exercise the platform pipeline and the report data builders
      # headlessly — no Shiny, no browser. Ubuntu's r-cran-* packages are
      # prebuilt, so this installs in under a minute instead of compiling
      # the tidyverse from source.
      - name: Install R and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            r-base-core \
            r-cran-dplyr r-cran-tidyr r-cran-stringr r-cran-lubridate \
            r-cran-tibble r-cran-rlang r-cran-dbi r-cran-rsqlite \
            r-cran-jsonlite r-cran-digest r-cran-readxl r-cran-knitr \
            r-cran-shiny

      # --strict fails the job if a test script skips itself because a
      # dependency is missing, so a green run always means the tests ran.
      - name: Run tests
        working-directory: BCTU_Clinical_Trials_Dashboard
        run: Rscript tests/run_all.R --strict
